name: Update Stats & Language Cards

on:
  schedule:
    # Once a day, at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generates a static SVG instead of hitting a live third-party
      # endpoint on every profile view — see:
      # https://github.com/stats-organization/github-readme-stats-action
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=sanan011&show_icons=true&hide_border=true&bg_color=0D1117
            &title_color=FFC947&icon_color=FFC947&text_color=C9D1D9
            &ring_color=FFC947&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=sanan011&layout=compact&hide_border=true&bg_color=0D1117
            &title_color=FFC947&text_color=C9D1D9&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
