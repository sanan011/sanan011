name: Update README — Activity & Repositories

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Fills both:
      #   <!--START_SECTION:activity--> ... <!--END_SECTION:activity-->
      #   <!--START_SECTION:repos-->    ... <!--END_SECTION:repos-->
      - name: Update Recent Activity & Latest Repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: sanan011
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update recent activity and latest repositories"
          git push
